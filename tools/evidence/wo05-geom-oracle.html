<!doctype html>
<meta charset="utf-8">
<title>wo05 geom oracle</title>
<pre id="out">pending</pre>
<script id="view" type="application/json">__VIEW_JSON__</script>
<script id="tree" type="application/json">__TREE_JSON__</script>
<script>
const view = JSON.parse(document.getElementById('view').textContent);
const raw = JSON.parse(document.getElementById('tree').textContent);
const radii = raw.constants.orbitRadii, per = raw.constants.skillsPerOrbit;
const ids = Object.keys(raw.nodes)
  .filter(id => !raw.nodes[id].ascendancyName && raw.groups[raw.nodes[id].group] !== undefined)
  .sort((a,b) => Number(a)-Number(b));
const idx = new Map(); ids.forEach((id,i)=>idx.set(id,i));
function kindOf(n){
  if (n.classStartIndex !== undefined) return 5;
  if (n.isKeystone) return 2;
  if (n.isNotable) return 1;
  if (n.isMastery) return 3;
  if (n.isJewelSocket) return 4;
  return 0;
}
const zoom = view.zoom, panx = view.pan[0], pany = view.pan[1], ds = view.designScale;
const vw = 1920, vh = 1080, pad = 20;
function sx(x){ return (panx + x * zoom) * ds; }
function sy(y){ return (pany + y * zoom) * ds; }
function vis(x,y,kind){
  const cx = panx + x * zoom, cy = pany + y * zoom;
  const sizes = [46,72,104,84,72,104];
  const r = (sizes[kind]||46)*zoom*0.5 + pad;
  return cx+r>=0 && cx-r<=vw && cy+r>=0 && cy-r<=vh;
}
const pts = [];
for (let i=0;i<ids.length;i++){
  const n = raw.nodes[ids[i]], g = raw.groups[n.group];
  let x = g.x, y = g.y;
  if (n.orbit > 0) {
    const a = n.orbitIndex * 2 * Math.PI / per[n.orbit];
    x = g.x + radii[n.orbit] * Math.sin(a);
    y = g.y - radii[n.orbit] * Math.cos(a);
  }
  pts.push({i, n, x, y, k: kindOf(n)});
}
function edgeVis(ax,ay,bx,by){
  const minX=Math.min(ax,bx)-60, maxX=Math.max(ax,bx)+60;
  const minY=Math.min(ay,by)-60, maxY=Math.max(ay,by)+60;
  return maxX>=0 && minX<=vw && maxY>=0 && minY<=vh;
}
const nodes = [];
for (const p of pts){
  if (!vis(p.x,p.y,p.k)) continue;
  nodes.push({id:p.i, skill:Number(ids[p.i]), kind:p.k, x:p.x, y:p.y, sx:sx(p.x), sy:sy(p.y)});
}
const edges = [];
for (const p of pts){
  const lists = [p.n.out||[], p.n.in||[]];
  const seen = new Set();
  for (const list of lists) for (const o of list){
    const j = idx.get(o);
    if (j === undefined || j <= p.i || seen.has(j)) continue;
    seen.add(j);
    const q = pts[j];
    const ax = panx + p.x*zoom, ay = pany + p.y*zoom;
    const bx = panx + q.x*zoom, by = pany + q.y*zoom;
    if (!edgeVis(ax,ay,bx,by)) continue;
    edges.push({a:p.i,b:j,ax:ax*ds,ay:ay*ds,bx:bx*ds,by:by*ds});
  }
}
const out = {name:view.name, zoom, pan:view.pan, designScale:ds, lod:view.lod, visibleNodeCount:nodes.length, visibleEdgeCount:edges.length, nodes, edges};
document.getElementById('out').textContent = JSON.stringify(out);
</script>
